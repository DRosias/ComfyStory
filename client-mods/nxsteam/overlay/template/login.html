<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ComfyStory</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="titlebar">
        <span>ComfyStory Launcher</span>
        <div class="window-controls">
            <button id="minimize" type="button" aria-label="Minimize">&#8722;</button>
            <button id="close" type="button" aria-label="Close">&#215;</button>
        </div>
    </div>
    <main>
        <div class="brand-mark">C</div>
        <h1>Welcome to ComfyStory</h1>
        <p class="subtitle">Sign in and get comfortable.</p>

        <form id="username-form" class="panel">
            <label for="username">Username</label>
            <input id="username" name="username" minlength="4" maxlength="255" autocomplete="username" required autofocus>
            <button class="primary" type="submit">Continue</button>
        </form>

        <form id="password-form" class="panel hidden">
            <p class="account-line">Signing in as <strong id="existing-username"></strong></p>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" maxlength="255" autocomplete="current-password" required>
            <button class="primary" type="submit">Log in &amp; Play</button>
            <button class="secondary back" type="button">Use another username</button>
        </form>

        <form id="register-form" class="panel hidden">
            <p class="account-line"><strong id="new-username"></strong> is available.</p>
            <label for="new-password">Create password</label>
            <input id="new-password" type="password" minlength="6" maxlength="255" autocomplete="new-password" required>
            <label for="verify-password">Verify password</label>
            <input id="verify-password" type="password" minlength="6" maxlength="255" autocomplete="new-password" required>
            <button class="primary" type="submit">Create Account &amp; Play</button>
            <button class="secondary back" type="button">Use another username</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script src="login.js"></script>
</body>
</html>
